services:
  # ── Vector Database ─────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: it-helpdesk-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' && echo ok"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 15s

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: it-helpdesk-backend
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - ./backend/.env
    environment:
      - QDRANT_URL=http://qdrant:6333   # override to use container name
      - HF_HUB_OFFLINE=1
    volumes:
      - ./backend/data:/app/data         # persist uploaded PDFs
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface  # persist embedding model cache
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)\" 2>/dev/null && echo ok"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── React Frontend ───────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: it-helpdesk-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  qdrant_storage:
